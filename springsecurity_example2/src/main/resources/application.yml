server:
  #服务器的HTTP端口
  port: 8080
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/test_security?characterEncoding=utf-8&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
    mode: HTML
    cache: false
  # 自定义密码
  security:
    user:
      name: test
      password: 123456
      roles: admin,user

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
