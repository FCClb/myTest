spring:
  application:
    name: order # 服务名
  profiles:
    active: study # 环境（自定义的）
  cloud:
    nacos:
      discovery:  # 注册中心地址
        server-addr: localhost:8848
      config: # 配置中心地址
        server-addr: localhost:8848
        file-extension: yml # 文件后缀

# 可用nacos配置中心管理
# 会默认按照下面的格式，找nacos中写好的配置文件
# ${spring.application.name}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
#  服务名-环境.文件后缀
#server:
#  port: 8090

# sentinel配置
    sentinel:
      transport:
        dashboard: localhost:8080

#      利用nacos实现持久化配置
      datasource:
        flow: # 流控
          nacos:
            server-addr: ${spring.cloud.nacos.config.server-addr}
#            group-id:
            data-id: ${spring.application.name}-flow.json
            data-type: json
            rule-type: flow
        degrade:  # 降级
          nacos:
            server-addr: ${spring.cloud.nacos.config.server-addr}
#            group-id:
            data-id: ${spring.application.name}-degrade.json
            data-type: json
            rule-type: degrade

#openfeign 配置
feign:
  client:
    config:
      default:
        read-timeout: 5000 # 默认设置所有服务超时5秒会报错
      stock:
        read-timeout: 1000  # 单独对某个服务设置超时（优先生效）